# Edit node_name and mtls_public_endpoint before installation.
version: 1
node_name: node-a
api_address: ":8080"
mtls_address: ":8443"
mtls_public_endpoint: https://node-a.example.com:8443
data_dir: /var/lib/jolt
keys_dir: /var/lib/jolt-keys
mounts:
  - id: files
    name: Files
    local_path: /mnt/files
    mode: read_write
    published: true
    enabled: true
transfer_grants: []
