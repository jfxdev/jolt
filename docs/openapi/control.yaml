openapi: 3.1.0
info:
  title: Jolt Control Tower API
  version: 1.0.0
  description: |
    Authenticated Control Tower API and public read-only shares. This contract
    version is independent of the dated application release. The /api/v1 prefix
    is stable and does not identify the container release.
    Browser callers use the jolt_control_session cookie. Automation uses an API
    key as Authorization: Bearer <token>; service accounts also require an active
    access group and effective RBAC grants. Errors use code, message and an
    optional correlation_id. Send X-Correlation-ID to correlate audit records.
    Unless explicitly public, every operation requires authentication.
  contact:
    url: https://github.com/jfxdev/jolt
servers:
  - url: /
tags:
  - {name: System}
  - {name: Authentication}
  - {name: Administration}
  - {name: Nodes}
  - {name: Transfers}
  - {name: Shares}
  - {name: Node proxy}
paths:
  /health:
    get:
      tags: [System]
      summary: Legacy liveness endpoint
      security: []
      responses:
        '200': {$ref: '#/components/responses/Health'}
  /livez:
    get:
      tags: [System]
      summary: Process liveness
      description: Does not check database, mounts or peers.
      security: []
      responses:
        '200': {$ref: '#/components/responses/Health'}
  /readyz:
    get:
      tags: [System]
      summary: Local readiness
      description: Checks local state/database. Does not require all nodes, mounts or peers to be available.
      security: []
      responses:
        '200': {$ref: '#/components/responses/Health'}
        '503': {$ref: '#/components/responses/Health'}
  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics
      description: Registered only when CONTROL_TOWER_METRICS_TOKEN is configured. Uses a dedicated token, not an operator credential.
      security: [{metricsBearer: []}]
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/auth/login:
    post:
      tags: [Authentication]
      summary: Create a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Session created; the HttpOnly cookie is set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Error'}
        '429':
          description: Persisted login lockout; honor Retry-After
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/control-tower/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current browser session
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/auth/me:
    get:
      tags: [Authentication]
      summary: Current actor
      responses:
        '200':
          description: Current user or service-account identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  actor_type: {type: string, enum: [user, service_account]}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/auth/permissions:
    post:
      tags: [Authentication]
      summary: Evaluate effective permissions for up to 100 Node Paths
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PermissionsRequest'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/subjects/{actorType}/{subjectID}/effective-access:
    post:
      tags: [Administration]
      summary: What an identity can do at concrete paths
      description: >-
        Read-only diagnostic for administrators with `sudo` on `control-tower/policies`.
        Evaluates up to 50 paths with the evaluators the Control Tower and the node use.
        Typed rules treat files and directories differently, so each check names the
        entry type the node would find. `outcome` is `allowed`, `denied` (no grant or a
        path denial), `hidden` (a typed rule makes the file disappear) or `blocked`
        (shown but unusable). Per-credential agent ceilings and CIDR filters are not
        considered. The query is audited.
      parameters:
        - {name: actorType, in: path, required: true, schema: {type: string, enum: [user, service_account]}}
        - {name: subjectID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checks]
              properties:
                checks:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [path, entry_type]
                    properties:
                      path: {type: string, example: nodes/n1/files/mounts/media/docs/key.pem}
                      entry_type: {type: string, enum: [file, directory]}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/pending-operations:
    get:
      tags: [Administration]
      summary: List requests waiting for, or past, a human decision
      description: >-
        Needs `list` on `control-tower/approvals`; `mine=true` lists only the caller's own
        requests. Answers 404 `approvals_disabled` unless CONTROL_TOWER_APPROVALS is on.
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [pending, executing, executed, failed, rejected, expired, indeterminate]}}
        - {name: mine, in: query, schema: {type: boolean}}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/pending-operations/{operationID}:
    get:
      tags: [Administration]
      summary: One request waiting for a decision
      description: The requester may read their own request; anyone else needs `list` on `control-tower/approvals`.
      parameters:
        - {name: operationID, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/pending-operations/{operationID}/approve:
    post:
      tags: [Administration]
      summary: Approve a waiting request and run it
      description: >-
        A person (never an API key or agent) with `sudo` on `control-tower/approvals`. The
        stored request is replayed as the approver, with the approver's own current
        permissions, after the requester's are checked again; a request the approver may not
        make fails. Approving your own request needs `acknowledge_self_approval`. Repeating
        the call returns the stored result with `replayed: true` and never runs it twice. A
        request not decided within five minutes expires (410).
      parameters:
        - {name: operationID, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledge_self_approval: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/pending-operations/{operationID}/reject:
    post:
      tags: [Administration]
      summary: Reject a waiting request
      parameters:
        - {name: operationID, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 256}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/about:
    get:
      tags: [System]
      summary: Application build information
      responses:
        '200':
          description: Dated application version and source build metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BuildInfo'}
  /api/v1/control-tower/users:
    get:
      tags: [Administration]
      summary: List users
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Administration]
      summary: Create a user
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/users/{userID}:
    parameters: [{$ref: '#/components/parameters/UserID'}]
    patch:
      tags: [Administration]
      summary: Update role, enabled state or password
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Administration]
      summary: Delete a user while preserving audit history
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/service-accounts:
    get:
      tags: [Administration]
      summary: List service accounts
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    post:
      tags: [Administration]
      summary: Create a service account and its first API key
      description: A plaintext API key is returned only at issuance. Agent credentials default to 30 days and have mandatory usage limits.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceAccountInput'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/service-accounts/disable:
    post:
      tags: [Administration]
      summary: Disable all agent accounts and cancel their active requests
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [agent]}}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/service-accounts/{serviceAccountID}:
    parameters: [{$ref: '#/components/parameters/ServiceAccountID'}]
    patch:
      tags: [Administration]
      summary: Update a service account
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Administration]
      summary: Delete a service account and revoke its keys
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/service-accounts/{serviceAccountID}/tokens:
    parameters: [{$ref: '#/components/parameters/ServiceAccountID'}]
    get:
      tags: [Administration]
      summary: List API-key metadata, never token hashes or plaintext
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    post:
      tags: [Administration]
      summary: Issue or rotate an API key
      description: The new plaintext credential is returned once. Existing keys can be independently revoked.
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/service-accounts/{serviceAccountID}/workload-identities:
    parameters: [{$ref: '#/components/parameters/ServiceAccountID'}]
    get:
      tags: [Administration]
      summary: List workload identity mappings for a service account
      responses:
        '200':
          description: Mappings and credential limits; no bearer tokens
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/WorkloadIdentity'}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [Administration]
      summary: Create an explicit workload identity mapping
      description: The provider must be configured. Creating a mapping does not yet enable JWT authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkloadIdentityInput'}
      responses:
        '201':
          description: Created mapping with a stable credential ID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkloadIdentity'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/service-accounts/{serviceAccountID}/workload-identities/{credentialID}:
    parameters:
      - {$ref: '#/components/parameters/ServiceAccountID'}
      - {name: credentialID, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Administration]
      summary: Enable or disable a mapping while preserving its credential quota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/service-accounts/{serviceAccountID}/tokens/{tokenID}:
    parameters:
      - {$ref: '#/components/parameters/ServiceAccountID'}
      - {$ref: '#/components/parameters/TokenID'}
    delete:
      tags: [Administration]
      summary: Revoke one API key immediately
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Administration]
      summary: Update one agent credential's limits and cancel its active requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_limits]
              properties:
                agent_limits: {$ref: '#/components/schemas/AgentLimits'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/access-groups:
    get:
      tags: [Administration]
      summary: List reusable node and policy access groups
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    post:
      tags: [Administration]
      summary: Create an access group
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/access-groups/{groupID}:
    parameters: [{$ref: '#/components/parameters/GroupID'}]
    patch:
      tags: [Administration]
      summary: Update an access group
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Administration]
      summary: Delete an access group
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/access-groups/{groupID}/nodes:
    parameters: [{$ref: '#/components/parameters/GroupID'}]
    get:
      tags: [Administration]
      summary: List nodes allowed by an access group
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    put:
      tags: [Administration]
      summary: Replace the node allow-list
      requestBody: {$ref: '#/components/requestBodies/AccessGroupIDs'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/access-groups/{groupID}/policies:
    parameters: [{$ref: '#/components/parameters/GroupID'}]
    get:
      tags: [Administration]
      summary: List policies assigned to an access group
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    put:
      tags: [Administration]
      summary: Replace policy assignments
      requestBody: {$ref: '#/components/requestBodies/AccessGroupIDs'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/policies:
    get:
      tags: [Administration]
      summary: List Node Path RBAC policies
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    post:
      tags: [Administration]
      summary: Create an RBAC policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyInput'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/policies/{policyID}:
    parameters: [{$ref: '#/components/parameters/PolicyID'}]
    patch:
      tags: [Administration]
      summary: Update an RBAC policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyInput'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Administration]
      summary: Delete an RBAC policy
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/roles:
    get:
      tags: [Administration]
      summary: List roles
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    post:
      tags: [Administration]
      summary: Create a role containing policies
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/roles/{roleID}:
    parameters: [{$ref: '#/components/parameters/RoleID'}]
    patch:
      tags: [Administration]
      summary: Update a role
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Administration]
      summary: Delete a role
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/users/{userID}/policies:
    parameters: [{$ref: '#/components/parameters/UserID'}]
    get:
      tags: [Administration]
      summary: List direct user policy assignments
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    put:
      tags: [Administration]
      summary: Replace direct user policy assignments
      requestBody: {$ref: '#/components/requestBodies/StringIDs'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/users/{userID}/policies/temporary:
    parameters: [{$ref: '#/components/parameters/UserID'}]
    get:
      tags: [Administration]
      summary: List active temporary user policy assignments
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    post:
      tags: [Administration]
      summary: Grant or renew a temporary user policy
      requestBody: {$ref: '#/components/requestBodies/TemporaryPolicy'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/users/{userID}/policies/temporary/{policyID}:
    parameters: [{$ref: '#/components/parameters/UserID'}, {$ref: '#/components/parameters/PolicyID'}]
    delete:
      tags: [Administration]
      summary: Revoke a temporary user policy
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/users/{userID}/roles:
    parameters: [{$ref: '#/components/parameters/UserID'}]
    get:
      tags: [Administration]
      summary: List user role assignments
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    put:
      tags: [Administration]
      summary: Replace user role assignments
      requestBody: {$ref: '#/components/requestBodies/StringIDs'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/service-accounts/{serviceAccountID}/policies:
    parameters: [{$ref: '#/components/parameters/ServiceAccountID'}]
    get:
      tags: [Administration]
      summary: List direct service-account policy assignments
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    put:
      tags: [Administration]
      summary: Replace direct service-account policy assignments
      requestBody: {$ref: '#/components/requestBodies/StringIDs'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/service-accounts/{serviceAccountID}/policies/temporary:
    parameters: [{$ref: '#/components/parameters/ServiceAccountID'}]
    get:
      tags: [Administration]
      summary: List active temporary service-account policy assignments
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    post:
      tags: [Administration]
      summary: Grant or renew a temporary service-account policy
      description: Agent profiles remain read-only regardless of the granted policy.
      requestBody: {$ref: '#/components/requestBodies/TemporaryPolicy'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/service-accounts/{serviceAccountID}/policies/temporary/{policyID}:
    parameters: [{$ref: '#/components/parameters/ServiceAccountID'}, {$ref: '#/components/parameters/PolicyID'}]
    delete:
      tags: [Administration]
      summary: Revoke a temporary service-account policy
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/service-accounts/{serviceAccountID}/groups:
    parameters: [{$ref: '#/components/parameters/ServiceAccountID'}]
    get:
      tags: [Administration]
      summary: List service-account access groups
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    put:
      tags: [Administration]
      summary: Replace service-account access groups
      description: A service account without an active group fails closed during authentication.
      requestBody: {$ref: '#/components/requestBodies/StringIDs'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/audit:
    get:
      tags: [Administration]
      summary: Query audit events with cursor pagination
      description: Use format=ndjson and after to export events in ascending order; X-Jolt-Next-After supplies the next cursor. When the hash chain has been enabled, new events include chain_data and chain_hash, and NDJSON checkpoint headers identify the chain boundary.
      parameters:
        - {name: before_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: format, in: query, schema: {type: string, enum: [json, ndjson]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
        - {name: actor_type, in: query, schema: {type: string, enum: [user, service_account]}}
        - {name: action, in: query, schema: {type: string}}
        - {name: result, in: query, schema: {type: string, enum: [allowed, denied]}}
        - {name: correlation_id, in: query, schema: {type: string}}
      responses:
        '200':
          description: Audit events as JSON or newline-delimited JSON
          headers:
            X-Jolt-Next-After: {schema: {type: integer, format: int64}, description: Cursor for the next NDJSON page}
            X-Jolt-Checkpoint-ID: {schema: {type: integer, format: int64}, description: Last retained chain checkpoint event ID}
            X-Jolt-Checkpoint-Hash: {schema: {type: string}, description: SHA-256 hash at the checkpoint}
            X-Jolt-Checkpoint-Reason: {schema: {type: string, enum: [activation, retention]}}
            X-Jolt-Has-More: {schema: {type: boolean}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/JSONObject'}}
            application/x-ndjson: {schema: {type: string}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/nodes:
    get:
      tags: [Nodes]
      summary: List nodes visible to the caller
      description: Registration states are refreshed from the nodes. Tokens are never returned.
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    post:
      tags: [Nodes]
      summary: Register a node and verify its operational token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NodeRegistration'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/nodes/{nodeID}:
    parameters: [{$ref: '#/components/parameters/NodeID'}]
    delete:
      tags: [Nodes]
      summary: Remove only the Control Tower registration
      description: Does not delete files, mounts, jobs, peers or grants on the node.
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/nodes/{nodeID}/rotate-token:
    post:
      tags: [Nodes]
      summary: Coordinate two-phase operational-token rotation
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/nodes/{nodeID}/rotate-identity:
    post:
      tags: [Nodes]
      summary: Rotate stable identity after exact fingerprint confirmation
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/nodes/{nodeID}/distribute-identity-handovers:
    post:
      tags: [Nodes]
      summary: Replay signed identity handovers to registered peers
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/nodes/{nodeID}/distribute-mtls-rotation:
    post:
      tags: [Nodes]
      summary: Distribute prepared mTLS public certificate rotation
      description: Private key material never leaves the source node.
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/nodes/{nodeID}/trust:
    get:
      tags: [Nodes]
      summary: Inspect both sides of node trust relationships
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/connections:
    get:
      tags: [Nodes]
      summary: List pairing orchestration requests
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    post:
      tags: [Nodes]
      summary: Create an expiring pairing request between registered nodes
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/connections/{requestID}/approve:
    post:
      tags: [Nodes]
      summary: Approve pairing with exact human fingerprint confirmation
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/connections/{requestID}/reconcile:
    post:
      tags: [Nodes]
      summary: Repair a partially completed pairing
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/connections/{requestID}/reject:
    post:
      tags: [Nodes]
      summary: Reject pairing and revoke its one-time invite
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/connections/{requestID}/revoke:
    post:
      tags: [Nodes]
      summary: Revoke trust on both nodes
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/transfers/targets:
    post:
      tags: [Transfers]
      summary: Discover compatible destinations for a source selection
      description: Grant IDs are never accepted or returned by this logical API.
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, source]
              properties:
                operation: {type: string, enum: [copy, move]}
                source: {$ref: 'transfers.yaml#/components/schemas/Source'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/mounts/{mountID}/files/destructive-plans:
    post:
      tags: [Node proxy]
      summary: Plan the deletion or move of a directory tree
      description: |
        Available when the Control Tower runs signed local jobs. With that mode on,
        deleting recursively or moving a directory through the direct routes answers
        409 plan_required; use this plan and its confirmation instead. The node
        inspects the tree (files, directories, bytes and an identity digest) and
        records a five-minute plan for the current actor. The response carries the
        one-use confirmation token once. Permissions are the same as for the direct
        operation, including the refusal when a deny rule sits inside the tree. When a
        grant needs a person's approval (CONTROL_TOWER_APPROVALS) the answer is 202
        with a `pending_operation_id` and the counts instead of a plan: the token is
        withheld, and the approver plans and confirms again as themselves.
      parameters:
        - {$ref: '#/components/parameters/NodeID'}
        - {$ref: '#/components/parameters/MountID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, source_path]
              properties:
                operation: {type: string, enum: [delete, move]}
                source_path: {type: string}
                destination_path: {type: string}
                overwrite: {type: boolean, description: Only for move; replaces an existing destination directory, whose contents are pinned by the plan}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '202': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/mounts/{mountID}/files/destructive-plans/{planID}/confirm:
    post:
      tags: [Node proxy]
      summary: Confirm a destructive plan and start its job
      description: |
        Consumes the plan's token and creates a job bound to the caller's current
        authorization, renewed while it runs. Before changing anything the node
        inspects the tree again; if it no longer matches the plan the job fails
        with tree_changed and nothing is touched, and a new plan is needed. A
        removal interrupted midway is not resumed and cannot be undone. Repeating
        the same Idempotency-Key returns the same job; the plan token is never
        returned. If the caller lost permission since the plan, 403 and the job is
        canceled.
      parameters:
        - {$ref: '#/components/parameters/NodeID'}
        - {$ref: '#/components/parameters/MountID'}
        - {name: planID, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '202': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/transfers/plan:
    post:
      tags: [Transfers]
      summary: Preview a logical transfer without creating a job
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: 'transfers.yaml#/components/schemas/LogicalTransfer'}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/transfers:
    post:
      tags: [Transfers]
      summary: Create an idempotent durable logical transfer
      description: |
        With signed local jobs enabled, a copy is planned by the destination node
        under the caller's current policy and runs only while its authorization is
        renewed: entries the policy hides are left out and reported as a count, and
        the job id is derived from the actor and the Idempotency-Key. A move needs
        its preview first: the plan response carries move_plan (plan_id and a
        one-use token) and creating the move must send it back as move_plan,
        otherwise 422 plan_required. The node refuses the move when anything it
        previewed changed (409 tree_changed) or when part of the selection is
        hidden from the caller (409 move_incomplete). The direct pull routes
        answer 409 use_logical_transfer. When a source or destination grant needs a
        person's approval (CONTROL_TOWER_APPROVALS), the creation answers 202 with a
        `pending_operation_id` and the preview's counts instead of a job; the approver
        previews and creates it again under their own policy.
        Idempotency-Key is required (1–512 characters). Repeating the same key
        and logical payload returns the existing job. Reusing the key with a
        different payload returns 409 idempotency_conflict. Records are durable;
        clients must not assume an expiration window.
      parameters:
        - {$ref: '#/components/parameters/NodeID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: 'transfers.yaml#/components/schemas/LogicalTransfer'}
      responses:
        '202':
          description: Job accepted; Location identifies the destination-node job resource
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: 'transfers.yaml#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/shares:
    get:
      tags: [Shares]
      summary: List shares owned by the caller, or all for share administrators
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
    post:
      tags: [Shares]
      summary: Create a read-only public share
      description: The token is returned exactly once. Every later access re-evaluates the creator's RBAC. Automation shares bind the issuing credential and recheck account status, credential revocation and expiry, and group membership; credential identifiers are not returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateShare'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/shares/{shareID}/revoke:
    post:
      tags: [Shares]
      summary: Revoke a public share immediately
      parameters: [{$ref: '#/components/parameters/ShareID'}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/control-tower/shares/{shareID}:
    parameters: [{$ref: '#/components/parameters/ShareID'}]
    delete:
      tags: [Shares]
      summary: Delete share metadata after authorization
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/public/shares/{token}:
    parameters: [{$ref: '#/components/parameters/ShareToken'}]
    get:
      tags: [Shares]
      summary: Public share metadata without revealing node, mount or backing path
      security: []
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/public/shares/{token}/unlock:
    parameters: [{$ref: '#/components/parameters/ShareToken'}]
    post:
      tags: [Shares]
      summary: Unlock one password-protected share with a scoped cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, format: password}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/public/shares/{token}/list:
    parameters: [{$ref: '#/components/parameters/ShareToken'}]
    get:
      tags: [Shares]
      summary: List within a public directory share
      security: []
      parameters:
        - {name: path, in: query, schema: {type: string, default: .}}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/public/shares/{token}/content:
    parameters: [{$ref: '#/components/parameters/ShareToken'}]
    get:
      tags: [Shares]
      summary: Download public shared content
      description: Every successful content response, including Range responses, consumes download budget atomically before bytes are sent. A zero max_downloads means no download-count limit. Failed node or authorization checks do not consume the budget.
      security: []
      parameters:
        - {name: path, in: query, schema: {type: string}}
        - {name: Range, in: header, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Binary'}
        '206': {$ref: '#/components/responses/Binary'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '416': {$ref: '#/components/responses/Error'}
  /api/v1/public/shares/{token}/archive:
    parameters: [{$ref: '#/components/parameters/ShareToken'}]
    get:
      tags: [Shares]
      summary: Stream a ZIP for an archive-enabled public share
      security: []
      parameters:
        - {name: path, in: query, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Binary'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/mounts/{mountID}/trash:
    get:
      tags: [Node proxy]
      summary: List what a mount's trash keeps
      description: >-
        For mounts with trash enabled in node.yaml, where a delete moves the entry for the configured
        retention. Handled by the Control Tower, never passed through: only entries the caller could
        read at their original path are listed, and agents get 403 `trash_not_for_agents`. Answers 409
        `node_upgrade_required` when the node lacks `trash_v1`.
      parameters:
        - {name: nodeID, in: path, required: true, schema: {type: string}}
        - {name: mountID, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/mounts/{mountID}/trash/{trashID}:
    get:
      tags: [Node proxy]
      summary: Read one kept entry
      description: Needs `read` at the entry's original path; otherwise it answers 404 as if the entry did not exist.
      parameters:
        - {name: nodeID, in: path, required: true, schema: {type: string}}
        - {name: mountID, in: path, required: true, schema: {type: string}}
        - {name: trashID, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Node proxy]
      summary: Purge a kept entry for good
      description: Needs `delete` at the entry's original path. A grant marked `needs_approval` is refused here.
      parameters:
        - {name: nodeID, in: path, required: true, schema: {type: string}}
        - {name: mountID, in: path, required: true, schema: {type: string}}
        - {name: trashID, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/mounts/{mountID}/trash/{trashID}/restore:
    post:
      tags: [Node proxy]
      summary: Put a kept entry back where it was
      description: >-
        Needs `create` at the entry's original path. Never overwrites: 409 when the name is taken, 404 when
        the folder it was in is gone, 422 `hidden_name` when the name has since become hidden.
      parameters:
        - {name: nodeID, in: path, required: true, schema: {type: string}}
        - {name: mountID, in: path, required: true, schema: {type: string}}
        - {name: trashID, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/mounts/{mountID}/files/content:
    parameters:
      - {$ref: '#/components/parameters/NodeID'}
      - {$ref: '#/components/parameters/MountID'}
      - {name: path, in: query, required: true, schema: {type: string}}
    get:
      tags: [Node proxy]
      summary: Read file content
      responses:
        '200': {$ref: '#/components/responses/Binary'}
        '206': {$ref: '#/components/responses/Binary'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Node proxy]
      summary: Upload file content
      description: Requires create and, when overwriting, update on the final destination. When signed uploads are enabled, the context binds the destination, query options and idempotency key, and the upload must complete before expiration.
      parameters:
        - {name: overwrite, in: query, schema: {type: boolean}}
        - {name: editor, in: query, schema: {type: boolean}}
        - {name: Idempotency-Key, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '201': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/mounts/{mountID}/files/uploads:
    parameters:
      - {$ref: '#/components/parameters/NodeID'}
      - {$ref: '#/components/parameters/MountID'}
    get:
      tags: [Node proxy]
      summary: List resumable upload sessions visible to the caller
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Node proxy]
      summary: Open a resumable upload session
      description: The Control Tower authorizes the mount and destination, requiring create and, for overwrite, update. With signed uploads enabled the exact admission body and credential are bound to the session. Existing unbound sessions and sessions from another login require explicit reauthorization before resumption. Chunk offsets are durable on the node; the browser must reselect the same source file after reload.
      requestBody: {$ref: '#/components/requestBodies/JSONObjectRequired'}
      responses:
        '201': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '507': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/mounts/{mountID}/files/uploads/{uploadID}:
    parameters:
      - {$ref: '#/components/parameters/NodeID'}
      - {$ref: '#/components/parameters/MountID'}
      - {$ref: '#/components/parameters/UploadID'}
    get:
      tags: [Node proxy]
      summary: Read the persisted upload offset and destination
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Node proxy]
      summary: Append one chunk at the durable offset
      description: Send Content-Range with the exact current offset. Authorization is resolved from the persisted session, not a client-supplied path. Signed sessions require the same actor and credential and expire within 30 seconds per request.
      parameters:
        - {name: Content-Range, in: header, required: true, schema: {type: string, example: 'bytes 0-16777215/33554432'}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '416': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Node proxy]
      summary: Abort a resumable upload and remove its partial
      description: Signed sessions require current authorization by the bound actor and credential.
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/mounts/{mountID}/files/uploads/{uploadID}/complete:
    parameters:
      - {$ref: '#/components/parameters/NodeID'}
      - {$ref: '#/components/parameters/MountID'}
      - {$ref: '#/components/parameters/UploadID'}
    post:
      tags: [Node proxy]
      summary: Verify and atomically publish a completed upload
      description: The destination is the one persisted with the session. A repeat may return the durable completion receipt; it must not require reupload. Optional node upload inspection can reject content and remove the partial and session before publishing.
      responses:
        '200': {$ref: '#/components/responses/JSONObject'}
        '201': {$ref: '#/components/responses/JSONObject'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/mounts/{mountID}/files/uploads/{uploadID}/authorize:
    parameters:
      - {$ref: '#/components/parameters/NodeID'}
      - {$ref: '#/components/parameters/MountID'}
      - {$ref: '#/components/parameters/UploadID'}
    post:
      tags: [Node proxy]
      summary: Explicitly reauthorize a resumable upload session
      description: Revalidates current permissions and the persisted destination. A session already bound to an actor can only be reauthorized for that actor; a stale authorization cannot replace a newer credential.
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/jobs/events:
    parameters: [{$ref: '#/components/parameters/NodeID'}]
    get:
      tags: [Node proxy]
      summary: Stream durable job events with resumable SSE
      description: Heartbeats are comment frames. Reconnect with Last-Event-ID or the after query parameter; the Control Tower streams rather than buffering this response.
      parameters:
        - {name: job_id, in: query, schema: {type: string}}
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: Last-Event-ID, in: header, schema: {type: string}}
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema: {type: string, example: "id: 42\nevent: job\ndata: {\"job_id\":\"job_...\",\"state\":\"running\"}\n\n"}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{nodeID}/{resource}:
    parameters:
      - {$ref: '#/components/parameters/NodeID'}
      - name: resource
        in: path
        required: true
        description: Remaining node API resource path, including nested segments; represented as a wildcard by x-jolt-wildcard.
        schema: {type: string, example: mounts/files/files}
    x-jolt-wildcard: true
    x-jolt-resources: [node, mounts, jobs, pairing, peers, grants, transfers, crypto, fs]
    get:
      tags: [Node proxy]
      summary: Authorized GET proxy to the node API
      description: The exact node OpenAPI is available from the authenticated node at /openapi.yaml. The proxy validates resource and RBAC before forwarding and injects the operational token only server-side. Agent searches require a compatible node and are limited to 200 results, 10000 examined entries, depth 16 and 10 seconds; partial responses report truncated and truncated_reason. Agent file listings and search entries include a sanitized display_name; name and path remain canonical and can contain unsafe display characters. Agent content and ZIP reads require a compatible node and scan the first 64 KiB of each file before serving; detected secrets return secret_detected.
      responses:
        '200': {$ref: '#/components/responses/ProxyResult'}
        '206': {$ref: '#/components/responses/Binary'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
    post:
      tags: [Node proxy]
      summary: Authorized POST proxy to the node API
      requestBody: {$ref: '#/components/requestBodies/ProxyBody'}
      responses:
        '200': {$ref: '#/components/responses/ProxyResult'}
        '201': {$ref: '#/components/responses/ProxyResult'}
        '202': {$ref: '#/components/responses/ProxyResult'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
    put:
      tags: [Node proxy]
      summary: Authorized PUT/streaming-upload proxy to the node API
      requestBody: {$ref: '#/components/requestBodies/ProxyBody'}
      responses:
        '200': {$ref: '#/components/responses/ProxyResult'}
        '201': {$ref: '#/components/responses/ProxyResult'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Node proxy]
      summary: Authorized PATCH/chunk proxy to the node API
      requestBody: {$ref: '#/components/requestBodies/ProxyBody'}
      responses:
        '200': {$ref: '#/components/responses/ProxyResult'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '416': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Node proxy]
      summary: Authorized DELETE proxy to the node API
      responses:
        '200': {$ref: '#/components/responses/ProxyResult'}
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: jolt_control_session
    serviceBearer:
      type: http
      scheme: bearer
      description: API key issued to a service account; not the node operational or metrics token.
    metricsBearer:
      type: http
      scheme: bearer
      description: Dedicated CONTROL_TOWER_METRICS_TOKEN.
  parameters:
    UserID: {name: userID, in: path, required: true, schema: {type: string}}
    ServiceAccountID: {name: serviceAccountID, in: path, required: true, schema: {type: string}}
    TokenID: {name: tokenID, in: path, required: true, schema: {type: string}}
    GroupID: {name: groupID, in: path, required: true, schema: {type: string}}
    PolicyID: {name: policyID, in: path, required: true, schema: {type: string}}
    RoleID: {name: roleID, in: path, required: true, schema: {type: string}}
    NodeID: {name: nodeID, in: path, required: true, schema: {type: string}}
    MountID: {name: mountID, in: path, required: true, schema: {type: string}}
    UploadID: {name: uploadID, in: path, required: true, schema: {type: string}}
    RequestID: {name: requestID, in: path, required: true, schema: {type: string}}
    ShareID: {name: shareID, in: path, required: true, schema: {type: string}}
    ShareToken: {name: token, in: path, required: true, schema: {type: string}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 512}
  requestBodies:
    JSONObjectRequired:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/JSONObject'}
    StringIDs:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Assignment object; use node_ids, policy_ids, role_ids or group_ids as appropriate for the route.
            additionalProperties:
              type: array
              items: {type: string}
            example: {policy_ids: [pol_reader]}
    AccessGroupIDs:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            additionalProperties: false
            properties:
              ids: {type: array, maxItems: 100, items: {type: string}}
    TemporaryPolicy:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [policy_id]
            properties:
              policy_id: {type: string}
              duration_seconds: {type: integer, minimum: 1, maximum: 3600, default: 900}
    ProxyBody:
      required: false
      content:
        application/json:
          schema: {$ref: '#/components/schemas/JSONObject'}
        application/octet-stream:
          schema: {type: string, format: binary}
  schemas:
    JSONObject:
      type: object
      additionalProperties: true
    AgentLimits:
      type: object
      required: [requests_per_minute, burst, max_concurrent, max_response_bytes, daily_bytes]
      properties:
        requests_per_minute: {type: integer, minimum: 1, maximum: 60000, default: 60}
        burst: {type: integer, minimum: 1, maximum: 10000, default: 10}
        max_concurrent: {type: integer, minimum: 1, maximum: 32, default: 2}
        max_response_bytes: {type: integer, format: int64, minimum: 1024, maximum: 1073741824, default: 16777216}
        daily_bytes: {type: integer, format: int64, minimum: 1024, default: 1073741824}
        allowed_cidrs: {type: array, maxItems: 64, items: {type: string}, description: Empty allows any source address}
        read_media_types: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, example: text/plain}, description: Empty allows all media types. Exact types only; archive downloads and multipart ranges are refused while this restriction is active.}
        capabilities: {type: array, maxItems: 2, uniqueItems: true, items: {type: string, enum: [list, read]}, description: Optional capability ceiling. Omitted permits list and read; an empty array permits neither. Policies remain required.}
        request_deletes: {type: boolean, default: false, description: 'The credential may send a DELETE for a file and have it kept for a person to approve. It still cannot delete: only a rule of the account that needs approval covers it, and CONTROL_TOWER_APPROVALS must be on.'}
    WorkloadIdentityInput:
      type: object
      required: [provider_id, issuer, subject, audience]
      properties:
        provider_id: {type: string}
        issuer: {type: string, description: Empty for JWT-SVID providers}
        subject: {type: string}
        audience: {type: string}
        agent_limits: {$ref: '#/components/schemas/AgentLimits'}
    WorkloadIdentity:
      allOf:
        - {$ref: '#/components/schemas/WorkloadIdentityInput'}
        - type: object
          required: [credential_id, service_account_id, enabled, revoked, created_at, updated_at]
          properties:
            credential_id: {type: string}
            service_account_id: {type: string}
            enabled: {type: boolean}
            revoked: {type: boolean}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    ServiceAccountInput:
      type: object
      required: [name, group_ids]
      properties:
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        kind: {type: string, enum: [automation, agent], default: automation, description: Immutable after creation}
        group_ids: {type: array, items: {type: string}}
        token_name: {type: string}
        expires_at: {type: [string, 'null'], format: date-time}
        agent_limits: {$ref: '#/components/schemas/AgentLimits'}
    BuildInfo:
      type: object
      required: [version, commit, build_date]
      properties:
        version: {type: string, example: '2026-10-29'}
        commit: {type: string, example: 0123456789abcdef0123456789abcdef01234567}
        build_date: {type: string, example: '2026-10-29T12:00:00Z'}
        features:
          type: object
          description: Optional behaviours this Control Tower was started with.
          properties:
            typed_policies: {type: boolean, description: 'True when policy rules may restrict by file type (CONTROL_TOWER_TYPED_POLICIES).'}
            approvals: {type: boolean, description: 'True when rules may require human approval (CONTROL_TOWER_APPROVALS).'}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, unavailable]}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code; use this rather than parsing the localized message.
              examples: [permission_denied, invalid_json, idempotency_conflict, resource_not_found]
            message: {type: string}
            correlation_id: {type: string}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}
    User:
      type: object
      properties:
        user_id: {type: string}
        username: {type: string}
        role: {type: string, enum: [admin, operator, service_account]}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PermissionsRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, examples: ['nodes/node-a/files/mounts/files/public/**']}
    NodeRegistration:
      type: object
      required: [name, endpoint, token]
      properties:
        name: {type: string}
        endpoint: {type: string, format: uri, examples: ['https://node-a.internal.example:8080']}
        token: {type: string, format: password, writeOnly: true}
    PolicyInput:
      type: object
      required: [name, rules]
      properties:
        name: {type: string}
        description: {type: string}
        rules:
          type: array
          items:
            type: object
            required: [path, capabilities]
            properties:
              path:
                type: string
                description: '* matches one segment; trailing ** matches the path and descendants. deny has global precedence.'
              capabilities:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  enum: [read, list, create, update, delete, write, execute, sudo, deny]
              file_types:
                type: object
                description: |
                  Restricts the rule to files of these types. Accepted only when the Control Tower
                  runs with typed policies enabled; otherwise the policy is refused. The node
                  decides the real type of each entry. Directories are never filtered by type,
                  so a typed allow keeps them navigable. A typed deny may list the capabilities
                  it takes away; a path deny (no file_types) stands alone.
                properties:
                  classes: {type: array, items: {type: string, enum: [video, audio, image, document, archive, executable, secret]}}
                  extensions: {type: array, items: {type: string}, description: Without the dot, case-insensitive}
                  names: {type: array, items: {type: string}, description: Exact base names}
              visibility:
                type: string
                enum: [hidden, visible]
                description: Only with file_types. hidden (default) answers 404 and omits the entry; visible lists it and answers 403.
              needs_approval:
                type: array
                items: {type: string, enum: [delete, update]}
                description: |
                  Capabilities this rule grants only once a person approves each request.
                  Accepted only when the Control Tower runs with approvals enabled. Each one
                  must be granted by the rule; not allowed on a deny or a typed rule. Where a
                  request cannot be kept for approval the capability is refused, never granted.
    CreateShare:
      type: object
      required: [node_id, mount_id, path]
      properties:
        node_id: {type: string}
        mount_id: {type: string}
        path: {type: string, description: Mount-relative file or directory path}
        kind: {type: string, enum: [file, directory], default: file}
        password: {type: string, format: password, minLength: 8, writeOnly: true}
        allow_archive: {type: boolean}
        max_downloads: {type: integer, format: int64, minimum: 0, default: 0}
        expires_in_seconds: {type: integer, format: int64, minimum: 0, maximum: 31536000, default: 0}
  responses:
    Health:
      description: Health status
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Health'}
    Error:
      description: Structured API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    JSONObject:
      description: JSON response; route-specific fields are preserved
      content:
        application/json:
          schema: {$ref: '#/components/schemas/JSONObject'}
    Binary:
      description: Binary response; headers may include ETag, Content-Range and Content-Disposition
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
    ProxyResult:
      description: Proxied JSON, binary or event-stream response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/JSONObject'}
        application/octet-stream:
          schema: {type: string, format: binary}
        text/event-stream:
          schema: {type: string}
    NoContent:
      description: Operation completed without a response body
security:
  - sessionCookie: []
  - serviceBearer: []
