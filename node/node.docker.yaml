# Mount this file read-only. Changes require restarting the node.
version: 1
node_name: nas-home
api_address: ":8080"
mtls_address: ":8443"
mtls_public_endpoint: https://jolt-node:8443
data_dir: /var/lib/jolt
keys_dir: /var/lib/jolt-keys
mounts:
  - id: files
    name: Files
    local_path: /mnt/files
    mode: read_write
    published: true
    enabled: true
transfer_grants: []
