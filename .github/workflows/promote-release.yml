name: Promote dated release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Dated prerelease YYYY-MM-DD[.N]
        required: true
        type: string
      evidence:
        description: URL of the completed qualification evidence
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Promote identical artifacts to stable
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve prerelease and immutable digests
        id: release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?$'; then
            echo "invalid dated version" >&2
            exit 1
          fi
          git fetch --force --tags origin
          test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$VERSION" --json isPrerelease --jq .isPrerelease)" = true
          git checkout --detach "$VERSION"
          tag_message="$(git cat-file -p "$VERSION")"
          node_digest="$(printf '%s\n' "$tag_message" | sed -n 's/^Node digest: //p')"
          control_digest="$(printf '%s\n' "$tag_message" | sed -n 's/^Control digest: //p')"
          test -n "$node_digest"
          test -n "$control_digest"
          echo "node_digest=$node_digest" >> "$GITHUB_OUTPUT"
          echo "control_digest=$control_digest" >> "$GITHUB_OUTPUT"
      - name: Verify version tags still identify the approved digests
        env:
          VERSION: ${{ inputs.version }}
          NODE_DIGEST: ${{ steps.release.outputs.node_digest }}
          CONTROL_DIGEST: ${{ steps.release.outputs.control_digest }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          test "$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "ghcr.io/$owner/jolt-node:$VERSION")" = "$NODE_DIGEST"
          test "$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "ghcr.io/$owner/jolt-control:$VERSION")" = "$CONTROL_DIGEST"
          docker pull "ghcr.io/$owner/jolt-node@$NODE_DIGEST"
          docker pull "ghcr.io/$owner/jolt-control@$CONTROL_DIGEST"
      - name: Recheck exact promotion candidates
        env:
          VERSION: ${{ inputs.version }}
          NODE_DIGEST: ${{ steps.release.outputs.node_digest }}
          CONTROL_DIGEST: ${{ steps.release.outputs.control_digest }}
        run: |
          python3 scripts/container-smoke.py \
            --node-image "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jolt-node@$NODE_DIGEST" \
            --control-image "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jolt-control@$CONTROL_DIGEST" \
            --expected-version "$VERSION"
      - name: Mark the same release stable
        env:
          VERSION: ${{ inputs.version }}
          EVIDENCE: ${{ inputs.evidence }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          gh release view "$VERSION" --json body --jq .body > "$notes"
          printf '\n\n## Qualificação estável\n\n- Evidências: %s\n- Promoção: %s/%s/actions/runs/%s\n- Tag, commit e digests preservados; nenhum rebuild realizado.\n' "$EVIDENCE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$notes"
          gh release edit "$VERSION" --draft=false --prerelease=false --title "Jolt $VERSION" --notes-file "$notes"
