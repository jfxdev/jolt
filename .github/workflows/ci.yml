name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10"
  NODE_VERSION: "24"

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [node, control]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # The SQLCipher binding is CGO; the race detector needs the C toolchain too.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Verify node has no SQL runtime
        if: matrix.module == 'node'
        run: |
          CGO_ENABLED=0 go build ./backend/cmd/jolt-node
          if go list -deps ./backend/cmd/jolt-node | grep -E '(^database/sql$|sqlcipher|sqlite)'; then exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -timeout 20m ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: control/frontend/package-lock.json

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install browser for desktop/mobile tests
        run: npx playwright install --with-deps chromium

      - name: Browser scenarios (desktop and mobile)
        run: npm run test:e2e

      - name: Build
        run: npm run build

  acceptance:
    name: Acceptance (quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: node/go.sum

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # Interrupt/resume and parallel-directory transfers are the paths that
      # replace manual copies, so they gate every merge rather than running
      # only before a release.
      - name: Run quick acceptance profile
        run: make acceptance

  vulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [node, control]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  docker:
    name: Docker build and integration smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build node image
        uses: docker/build-push-action@v6
        with:
          context: node
          load: true
          tags: jolt-node:smoke
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max

      - name: Build Control Tower image
        uses: docker/build-push-action@v6
        with:
          context: control
          load: true
          tags: jolt-control:smoke
          cache-from: type=gha,scope=control
          cache-to: type=gha,scope=control,mode=max

      - name: Exercise actual container APIs
        run: python3 scripts/container-smoke.py
