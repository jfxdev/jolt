name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.11"
  NODE_VERSION: "24"

jobs:
  workflow-lint:
    name: Workflow and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify Go formatting
        run: |
          if git ls-files -z '*.go' | xargs -0 gofmt -l | grep -q .; then
            echo "Go files must be formatted with gofmt" >&2
            exit 1
          fi

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        # actionlint does not yet parse GitHub's documented queue setting.
        run: actionlint -ignore 'unexpected key "queue"' .github/workflows/*.yml

      - name: Test dated version allocation
        run: python3 -m unittest scripts/release_version_test.py

  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [node, control]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # The runner's apt mirrors all live under ubuntu.com (Azure's mirror
      # included), so an outage of that domain fails the job before any test
      # runs. apt moves down the list on failure and checks Canonical's
      # signatures whatever the mirror, so one outside ubuntu.com goes last.
      - name: Add an apt mirror outside ubuntu.com as a fallback
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
          fi

      # The SQLCipher binding is CGO; the race detector needs the C toolchain too.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Verify node has no SQL runtime
        if: matrix.module == 'node'
        run: |
          CGO_ENABLED=0 go build ./backend/cmd/jolt-node
          if go list -deps ./backend/cmd/jolt-node | grep -E '(^database/sql$|sqlcipher|sqlite)'; then exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -timeout 20m ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: control/frontend/package-lock.json

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The runner's apt mirrors all live under ubuntu.com (Azure's mirror
      # included), so an outage of that domain fails the job before any test
      # runs. apt moves down the list on failure and checks Canonical's
      # signatures whatever the mirror, so one outside ubuntu.com goes last.
      - name: Add an apt mirror outside ubuntu.com as a fallback
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
          fi

      - name: Install browser for desktop/mobile tests
        run: npx playwright install --with-deps chromium

      - name: Browser scenarios (desktop and mobile)
        run: npm run test:e2e

      - name: Build
        run: npm run build

  acceptance:
    name: Acceptance (quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: node/go.sum

      # Interrupt/resume and parallel-directory transfers are the paths that
      # replace manual copies, so they gate every merge rather than running
      # only before a release.
      - name: Run quick acceptance profile
        run: make acceptance

  vulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [node, control]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  docker:
    name: Docker build and integration smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build node image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: node
          load: true
          tags: jolt-node:smoke
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max

      - name: Build Control Tower image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: control
          load: true
          tags: jolt-control:smoke
          cache-from: type=gha,scope=control
          cache-to: type=gha,scope=control,mode=max

      # Same scanner, version and threshold as the release gate, so a HIGH or
      # CRITICAL finding fails the pull request instead of the post-merge run.
      - name: Block high and critical vulnerabilities (node)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: jolt-node:smoke
          version: v0.70.0
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Block high and critical vulnerabilities (control)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: jolt-control:smoke
          version: v0.70.0
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Exercise actual container APIs
        run: python3 scripts/container-smoke.py

  pr-gate:
    name: PR Gate
    if: ${{ always() }}
    needs: [workflow-lint, go, frontend, acceptance, vulncheck, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validator to pass
        env:
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          GO: ${{ needs.go.result }}
          FRONTEND: ${{ needs.frontend.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
          VULNCHECK: ${{ needs.vulncheck.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          test "$WORKFLOW_LINT" = success
          test "$GO" = success
          test "$FRONTEND" = success
          test "$ACCEPTANCE" = success
          test "$VULNCHECK" = success
          test "$DOCKER" = success

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pr-gate
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
