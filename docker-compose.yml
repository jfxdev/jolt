services:
  jolt-node:
    build:
      context: ./node
    restart: unless-stopped
    environment:
      JOLT_CONFIG_FILE: /etc/jolt/node.yaml
      CONTROL_TOWER_TOKEN: ${CONTROL_TOWER_TOKEN:?define CONTROL_TOWER_TOKEN}
      JOLT_STATE_ENCRYPTION_KEY: ${JOLT_STATE_ENCRYPTION_KEY:?define JOLT_STATE_ENCRYPTION_KEY}
      METRICS_TOKEN: ${NODE_METRICS_TOKEN:-}
      # With api_tls_cert_file and api_tls_key_file, set NODE_HEALTHCHECK_URL=https://127.0.0.1:8080/health.
      NODE_HEALTHCHECK_URL: ${NODE_HEALTHCHECK_URL:-http://127.0.0.1:8080/health}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      # Paths in this list are reconciled to PUID:PGID before the node starts.
      # Add every host bind mount that will be registered as a Jolt mount.
      JOLT_OWNED_PATHS: ${JOLT_OWNED_PATHS-/mnt/files}
    ports:
      # The Control Tower reaches the node over the compose network, so the
      # control API stays on loopback unless NODE_API_BIND is widened. The
      # peer listener is mTLS and must be reachable by other hosts.
      - "${NODE_API_BIND:-127.0.0.1}:8080:8080"
      - "${NODE_PEER_BIND:-0.0.0.0}:8443:8443"
    volumes:
      - ./node/node.docker.yaml:/etc/jolt/node.yaml:ro
      - ./runtime/node/data:/var/lib/jolt
      - ./runtime/node/keys:/var/lib/jolt-keys
      - ${JOLT_MOUNT_PATH:-./runtime/files}:/mnt/files:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # su-exec drops to PUID:PGID, and the entrypoint reconciles ownership
      # of the data, keys and mount paths before the process starts.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          memory: ${JOLT_MEMORY_LIMIT:-1g}
    healthcheck:
      # When API TLS is enabled, NODE_HEALTHCHECK_URL must use https://.
      # --no-check-certificate allows a private CA for this loopback liveness probe.
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- \"$${NODE_HEALTHCHECK_URL:-http://127.0.0.1:8080/health}\" >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  jolt-control:
    build:
      context: ./control
    restart: unless-stopped
    depends_on:
      jolt-node:
        condition: service_healthy
    environment:
      CONTROL_TOWER_METRICS_TOKEN: ${CONTROL_TOWER_METRICS_TOKEN:-}
      CONTROL_TOWER_TRUSTED_PROXIES: ${CONTROL_TOWER_TRUSTED_PROXIES:-}
      CONTROL_TOWER_AUDIT_RETENTION_DAYS: ${CONTROL_TOWER_AUDIT_RETENTION_DAYS:-0}
      CONTROL_TOWER_AUDIT_SEARCH_QUERY: ${CONTROL_TOWER_AUDIT_SEARCH_QUERY:-false}
      CONTROL_TOWER_AUDIT_HASH_CHAIN: ${CONTROL_TOWER_AUDIT_HASH_CHAIN:-false}
      CONTROL_TOWER_AUTHORIZATION_SIGNING_KEY_ID: ${CONTROL_TOWER_AUTHORIZATION_SIGNING_KEY_ID:-}
      # If configured, mount the key file read-only at this container path.
      CONTROL_TOWER_AUTHORIZATION_SIGNING_KEY_FILE: ${CONTROL_TOWER_AUTHORIZATION_SIGNING_KEY_FILE:-}
      CONTROL_TOWER_ADDRESS: :8090
      CONTROL_HEALTHCHECK_URL: ${CONTROL_HEALTHCHECK_URL:-http://127.0.0.1:8090/health}
      CONTROL_TOWER_DATA_DIR: /var/lib/jolt-control
      CONTROL_TOWER_STATIC_DIR: /opt/jolt-control/frontend
      CONTROL_TOWER_ADMIN_USERNAME: ${CONTROL_TOWER_ADMIN_USERNAME:-admin}
      CONTROL_TOWER_ADMIN_PASSWORD: ${CONTROL_TOWER_ADMIN_PASSWORD:?define CONTROL_TOWER_ADMIN_PASSWORD}
      CONTROL_TOWER_DB_ENCRYPTION_KEY: ${CONTROL_TOWER_DB_ENCRYPTION_KEY:?define CONTROL_TOWER_DB_ENCRYPTION_KEY}
      # Secure by default. Set to false only to reach the UI over plain HTTP
      # on a trusted LAN; the session cookie is then sent unencrypted.
      CONTROL_TOWER_SECURE_COOKIES: ${CONTROL_TOWER_SECURE_COOKIES:-true}
      CONTROL_TOWER_PUBLIC_BASE_URL: ${CONTROL_TOWER_PUBLIC_BASE_URL:-}
      CONTROL_TOWER_NODE_CA_FILE: ${CONTROL_TOWER_NODE_CA_FILE:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-077}
    ports:
      - "8090:8090"
    volumes:
      - ./runtime/control/data:/var/lib/jolt-control
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # su-exec drops to PUID:PGID, and the entrypoint reconciles ownership
      # of the data, keys and mount paths before the process starts.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          memory: ${JOLT_MEMORY_LIMIT:-1g}
    healthcheck:
      # With CONTROL_TOWER_TLS_MODE=managed the listener is HTTPS: set
      # CONTROL_HEALTHCHECK_URL=https://127.0.0.1:8090/health.
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- \"$${CONTROL_HEALTHCHECK_URL:-http://127.0.0.1:8090/health}\" >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # MCP over HTTP, from the same image as the Control Tower. It holds no
  # credential: each agent sends its own token, which the Control Tower checks
  # on every call. Bearer tokens cross this port in plain text unless TLS is
  # set, so it stays on loopback unless MCP_HTTP_BIND is widened.
  jolt-mcp:
    build:
      context: ./control
    restart: unless-stopped
    depends_on:
      jolt-control:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/jolt-mcp"]
    command: ["serve"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      JOLT_MCP_HTTP_ADDRESS: :8092
      # With CONTROL_TOWER_TLS_MODE=managed, use https://jolt-control:8090,
      # mount the root read-only and set JOLT_MCP_CA_FILE instead.
      JOLT_MCP_CONTROL_URL: ${JOLT_MCP_CONTROL_URL:-http://jolt-control:8090}
      JOLT_MCP_INSECURE_CONTROL_URL: ${JOLT_MCP_INSECURE_CONTROL_URL:-true}
      JOLT_MCP_TOOLSETS: ${JOLT_MCP_TOOLSETS:-files,inspect,files_write,jobs}
      JOLT_MCP_READ_ONLY: ${JOLT_MCP_READ_ONLY:-false}
      JOLT_MCP_ALLOWED_ORIGINS: ${JOLT_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "${MCP_HTTP_BIND:-127.0.0.1}:8092:8092"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${JOLT_MCP_MEMORY_LIMIT:-256m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
